name: F1 Fantasy reports

# Two schedules, two jobs. `tick` (hourly) decides from the race calendar
# whether anything is actually due, so most runs exit in seconds without
# installing a browser. `news` (daily) always runs: upgrade tracking and the
# news digest are meant to build up through the week, not gate on a race
# being imminent. Cron on a private repo bills against the free tier, hence
# tick's early exit.
#
# GitHub disables schedules on repos with no activity for 60 days, which will
# happen over the winter break -- a manual run re-arms it.
on:
  schedule:
    - cron: "7 * * * *"
    - cron: "13 7 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "Force a specific report instead of asking the calendar (or 'news' for the upgrade tracker + daily digest)"
        required: false
        type: choice
        options: ["", "pace", "preview", "lockout", "recap", "news"]
      round:
        description: "Round to act on (default: whatever the calendar says is current). Always set this when forcing an action for a past race, so the run cannot mark a different round done."
        required: false
        type: string
      race:
        description: "Race id to fetch (default: the API's current race id). Set this together with round whenever they differ -- the API's own \"current race\" pointer does not always match the calendar round you asked for by --round, and tick fetches by race id, not by round. Leaving this unset while forcing a past round silently re-captures whatever race the API still considers current."
        required: false
        type: string
      dry_run:
        description: "Render but do not send"
        required: false
        type: boolean
        default: false

concurrency:
  group: f1-fantasy
  cancel-in-progress: false

permissions:
  contents: write   # commits snapshots and rendered cards back
  issues: write     # opens the "refresh your cookie" issue

jobs:
  tick:
    runs-on: ubuntu-latest
    # The hourly cron, or a manual dispatch not asking for the daily news job.
    if: github.event.schedule == '7 * * * *' || (github.event_name == 'workflow_dispatch' && inputs.action != 'news')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Work out whether anything is due
        id: plan
        env:
          F1_FANTASY_TOKEN: ${{ secrets.F1_FANTASY_TOKEN }}
          F1_USER_GUID: ${{ secrets.F1_USER_GUID }}
        run: |
          pip install -e .
          python -m f1_fantasy plan \
            ${{ inputs.action && format('--force {0}', inputs.action) || '' }} \
            ${{ inputs.round && format('--round {0}', inputs.round) || '' }} \
            >> "$GITHUB_OUTPUT"

      # Everything below is skipped on a quiet tick, which is most of them.
      - name: Install Chromium
        if: steps.plan.outputs.due != ''
        run: playwright install --with-deps chromium

      - name: Cache FastF1 session data
        if: contains(steps.plan.outputs.due, 'pace')
        uses: actions/cache@v4
        with:
          path: .fastf1-cache
          key: fastf1-${{ steps.plan.outputs.season }}-${{ steps.plan.outputs.round }}
          restore-keys: fastf1-${{ steps.plan.outputs.season }}-

      - name: Run
        if: steps.plan.outputs.due != ''
        env:
          F1_FANTASY_TOKEN: ${{ secrets.F1_FANTASY_TOKEN }}
          F1_USER_GUID: ${{ secrets.F1_USER_GUID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python -m f1_fantasy tick \
            ${{ inputs.action && format('--force {0}', inputs.action) || '' }} \
            ${{ inputs.round && format('--round {0}', inputs.round) || '' }} \
            ${{ inputs.race && format('--race {0}', inputs.race) || '' }} \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      - name: Commit snapshots and cards
        if: steps.plan.outputs.due != ''
        run: |
          git config user.name "f1-fantasy-bot"
          git config user.email "actions@github.com"
          git add snapshots data out state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Capture ${{ steps.plan.outputs.due }} for round ${{ steps.plan.outputs.round }}"
            git push
          fi

      # An expired cookie is a routine five-day event, not a crash. Surface it
      # somewhere actionable instead of leaving a red X in the Actions tab.
      - name: Flag an expired session
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = "F1 Fantasy session cookie needs refreshing";
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "auth",
            });
            const body = [
              "The scheduled run failed. If the log shows an authentication error,",
              "the session cookie has expired (they last about five days).",
              "",
              "To refresh:",
              "1. Log in at https://fantasy.formula1.com",
              "2. DevTools (F12) -> Network -> reload",
              "3. Open the request to `/services/session/login`",
              "4. Copy `Token` and `GUID` from the response",
              "5. Update the `F1_FANTASY_TOKEN` and `F1_USER_GUID` repository secrets",
              "",
              `[Failed run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
            ].join("\n");

            if (open.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open[0].number,
                body: `Failed again: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ["auth"],
              });
            }

  # Upgrade-package tracking and the daily news digest: both fetch only
  # public RSS/Jolpica/FastF1 data (no F1_FANTASY_TOKEN/GUID needed), and
  # run here specifically because this runner has ordinary outbound
  # internet access -- unlike the sandboxed dev environment this project
  # is built in, which blocks several of the sites these draw from.
  news:
    runs-on: ubuntu-latest
    if: github.event.schedule == '13 7 * * *' || (github.event_name == 'workflow_dispatch' && inputs.action == 'news')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -e .

      # Only track-upgrades renders a card image; daily-digest is text-only.
      - name: Install Chromium
        run: playwright install --with-deps chromium

      - name: Track upgrade-package news
        run: python -m f1_fantasy track-upgrades

      - name: Send daily digest
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: |
          python -m f1_fantasy daily-digest \
            ${{ inputs.dry_run && '--dry-run' || '' }}

      # Unlike tick/preview/lockout/recap, picks needs no F1_FANTASY_TOKEN/
      # GUID -- calendar and the public driver feed are both public -- so
      # it still runs when the league session cookie has expired.
      - name: Send race picks
        if: ${{ !inputs.dry_run }}
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python -m f1_fantasy picks --email

      # f1fantasytools.com is unreachable from this project's dev sandbox
      # (network egress block, confirmed live), so this step -- one
      # screenshot + vision-extraction pass per page in F1FT_PAGES, see
      # predict/f1fantasytools_capture.py -- can only be tuned from real
      # runs here. It degrades to a skipped/empty capture per page on any
      # failure (missing key, blocked page, unparseable response) rather
      # than failing the job; the uploaded screenshots below are what let
      # a human check the actual page content against what got extracted.
      - name: Capture f1fantasytools.com benchmark snapshot
        if: env.ANTHROPIC_API_KEY != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m f1_fantasy collect-benchmark-snapshot

      - name: Upload f1fantasytools screenshots for inspection
        if: always() && env.ANTHROPIC_API_KEY != ''
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        uses: actions/upload-artifact@v4
        with:
          name: f1fantasytools-screenshots-${{ github.run_id }}
          path: data/pace/f1fantasytools_*_screenshot.jpg
          if-no-files-found: ignore
          retention-days: 14

      - name: Commit news data
        run: |
          git config user.name "f1-fantasy-bot"
          git config user.email "actions@github.com"
          git add data out 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "Daily upgrade tracking and news digest"
            git push
          fi
