[project]
name = "f1-fantasy-reporter"
version = "0.1.0"
description = "Automated reports on F1 Fantasy private leagues, rendered as shareable graphics."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "jinja2>=3.1",
    "playwright>=1.44",
    "feedparser>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
f1-fantasy = "f1_fantasy.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["f1_fantasy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
